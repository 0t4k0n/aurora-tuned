name: Publish known-good Aurora Tuned
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    env:
      SOURCE: ghcr.io/0t4k0n/aurora-dell5421@sha256:e57869686355651e93f1ed365b93a3ce0b7fa8daa30d12cf460f7a1fd2d68d79
      IMAGE: ghcr.io/0t4k0n/aurora-tuned
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.2
      - name: Copy known-good image and verify new signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GH_TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cosign verify --key cosign.pub "$SOURCE"
          skopeo copy --preserve-digests docker://"$SOURCE" docker://"$IMAGE:stable"
          target="$IMAGE@${SOURCE##*@}"
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY "$target"
          cosign verify --key cosign.pub "$target"
